<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hiring Pipeline{% endblock %}</title>
  <style>
    /* Every colour in this file goes through a token, and that is the whole
       reason the dark theme is a twenty-line block rather than a second
       stylesheet. A rule that hardcodes `#fff` renders white in *both* themes,
       which is how a dark mode ships broken on the one card nobody looked at.
       If you need a new shade, add a token to both blocks -- never a literal
       below them. */
    :root {
      /* Tells the browser how to render the parts of the page it owns rather
         than us: scrollbars, the caret, the focus ring on a control we have
         not styled, autofill. Without it a dark page keeps a bright scrollbar
         down the side, which is the detail that makes a theme look unfinished. */
      color-scheme: light;

      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #dfe3e8;
      --text: #1b1f24;
      --muted: #6b7280;
      --accent: #2f6feb;
      --accent-ink: #ffffff;      /* text drawn ON --accent, not text coloured BY it */
      --accent-hover: #2560d0;
      --danger: #b42318;
      --ok: #0f7b3f;

      --field: #ffffff;           /* inputs, buttons, candidate cards */
      --field-hover: #f0f2f5;
      --chip: #eef1f5;            /* stage counts, inline code, neutral badge */
      --column-head: #fafbfc;     /* header of a terminal column */

      --ok-bg: #e6f4ec;
      --ok-bg-faint: #f2fbf5;
      --danger-bg: #fdecea;
      --danger-bg-faint: #fdf2f0;
      --danger-border: #f0c2bd;
      --note-bg: #fff5e0;
      --note-fg: #8a5a00;

      --radius: 8px;
    }

    /* The dark theme. Only tokens change; not one selector below this block
       knows which theme is active. That is deliberate -- a component cannot
       work in one theme and not the other, it can only be right or wrong in
       both at once.

       The values are not an inversion, and that is the part worth reading. The
       background is a blue-tinted near-black rather than #000 and the text is
       #e6e9ef rather than #fff, because pure white on pure black is the
       combination that haloes on an OLED panel and makes 15px body text
       tiring. The accents are lightened for the same reason inverted: #2f6feb
       on a dark surface fails contrast, so links become #6ea8fe and --accent-ink
       flips to near-black, since white on a light-blue button is the one place
       the whole palette turns over. */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --bg: #0f1115;
        --surface: #171a21;
        --border: #272c36;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #6ea8fe;
        --accent-ink: #0f1115;
        --accent-hover: #8bbcff;
        --danger: #ff8a80;
        --ok: #6ee7a8;

        --field: #1d2129;
        --field-hover: #262b35;
        --chip: #262b35;
        --column-head: #1b1f27;

        --ok-bg: #16301f;
        --ok-bg-faint: #14261b;
        --danger-bg: #3a1d1b;
        --danger-bg-faint: #33201e;
        --danger-border: #6b3a34;
        --note-bg: #3a2f14;
        --note-fg: #ffd479;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
    header.top { margin-bottom: 20px; }
    header.top h1 { margin: 0 0 2px; font-size: 22px; }
    header.top p { margin: 0; color: var(--muted); font-size: 13px; }
    header.top a { font-size: 13px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }

    /* --- search ------------------------------------------------------- */
    form.search { display: flex; gap: 8px; }
    form.search input[type=text] {
      flex: 1; padding: 11px 13px; font-size: 15px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--field); color: var(--text);
    }
    form.search input[type=text]:focus {
      outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
    }
    button, .btn {
      padding: 10px 15px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--field); color: var(--text); cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { background: var(--field-hover); }
    button.primary {
      background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    }
    button.primary:hover { background: var(--accent-hover); }
    button.small { padding: 4px 9px; font-size: 12px; }
    button.danger { color: var(--danger); border-color: var(--danger-border); }
    button.danger:hover { background: var(--danger-bg-faint); }

    .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .hint code {
      background: var(--chip); padding: 2px 6px; border-radius: 4px;
      font-size: 12px; cursor: pointer;
    }

    /* --- the "we did not understand you" panel ------------------------- */
    .explain { border-left: 4px solid var(--danger); }
    .explain h2 { margin: 0 0 6px; font-size: 16px; color: var(--danger); }
    .explain p { margin: 0 0 10px; }
    .explain ul { margin: 6px 0 0; padding-left: 20px; }
    .explain li { margin-bottom: 4px; }

    /* --- board --------------------------------------------------------- */
    .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .column {
      flex: 1 0 190px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      display: flex; flex-direction: column; min-height: 120px;
    }
    .column h2 {
      margin: 0; padding: 11px 13px; font-size: 13px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .column h2 .count {
      background: var(--chip); border-radius: 10px; padding: 1px 8px;
      font-size: 12px; color: var(--text);
    }
    .column .body { padding: 9px; display: flex; flex-direction: column; gap: 8px; }
    .column .empty { color: var(--muted); font-size: 12px; padding: 3px; }
    .column.terminal h2 { background: var(--column-head); }

    /* --field, not --surface: the card sits on a column that is already
       --surface, and in the dark theme the two need to differ or the board
       reads as one flat block. */
    .candidate {
      border: 1px solid var(--border); border-radius: 6px;
      padding: 9px 10px; background: var(--field);
    }
    .candidate .name { font-weight: 600; font-size: 14px; }
    .candidate .name a { text-decoration: none; color: var(--text); }
    .candidate .name a:hover { text-decoration: underline; }
    .candidate .meta { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .candidate .actions { margin-top: 7px; display: flex; gap: 5px; }

    /* --- results ------------------------------------------------------- */
    .results { list-style: none; margin: 0; padding: 0; }
    .results li {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 2px; border-bottom: 1px solid var(--border);
    }
    .results li:last-child { border-bottom: none; }
    .results .rank {
      color: var(--muted); font-size: 12px; min-width: 22px; text-align: right;
    }
    .results .name { font-weight: 600; flex: 1; }
    .results .name a { text-decoration: none; color: var(--text); }
    .results .name a:hover { text-decoration: underline; }
    .results .meta { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 10px;
      font-size: 12px; text-transform: capitalize;
      background: var(--chip); color: var(--text);
    }
    .badge.hired { background: var(--ok-bg); color: var(--ok); }
    .badge.rejected { background: var(--danger-bg); color: var(--danger); }
    .badge.note { background: var(--note-bg); color: var(--note-fg); text-transform: none; }

    /* --- detail -------------------------------------------------------- */
    dl.facts { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; }
    dl.facts dt { color: var(--muted); font-size: 13px; }
    dl.facts dd { margin: 0; }
    table.history { width: 100%; border-collapse: collapse; margin-top: 6px; }
    table.history th, table.history td {
      text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border);
      font-size: 14px; vertical-align: top;
    }
    table.history th {
      color: var(--muted); font-size: 12px; text-transform: uppercase;
      letter-spacing: .04em; font-weight: 600;
    }
    table.history tr:last-child td { border-bottom: none; }
    .arrow { color: var(--muted); }
    .notice {
      border-left: 4px solid var(--ok); background: var(--ok-bg-faint);
      padding: 10px 13px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;
    }
    .notice.bad { border-left-color: var(--danger); background: var(--danger-bg-faint); }
    .addform { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .addform input {
      padding: 9px 11px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: inherit;
      /* Stated rather than inherited from the UA: `color-scheme: dark` would
         make this dark anyway, but relying on the browser to agree with our
         palette is how the two drift apart. */
      background: var(--field); color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1><a href="/" style="text-decoration:none;color:inherit">Hiring Pipeline</a></h1>
      <p>
        Backend Engineer &middot; {{ "{:,}".format(total_candidates) }} candidate{{ "" if total_candidates == 1 else "s" }}
        &middot; <a href="/docs">API docs</a>
      </p>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
